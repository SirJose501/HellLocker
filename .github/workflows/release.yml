name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --check

      - name: Test
        shell: pwsh
        run: cargo test --locked

      - name: Clippy
        shell: pwsh
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Read the package version from Cargo.toml/Cargo.lock.
          $metadata = cargo metadata `
            --locked `
            --no-deps `
            --format-version 1 |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "hd2-preset-helper" } |
            Select-Object -First 1

          if (-not $package) {
            throw "Package hd2-preset-helper was not found"
          }

          # Require the tag to match the Cargo package version.
          $expectedTag = "v$($package.version)"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $($package.version)"
          }

          cargo build --release --locked

          $exe = "target\release\HellLocker.exe"
          $packageDir = "dist\package\HellLocker"
          $zipName = "HellLocker-$expectedTag-windows-x64.zip"
          $zipPath = "dist\$zipName"

          if (-not (Test-Path $exe)) {
            throw "Executable was not produced: $exe"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageDir |
            Out-Null

          Copy-Item `
            -Path $exe `
            -Destination "$packageDir\HellLocker.exe"

          Copy-Item `
            -Path "LICENSE" `
            -Destination $packageDir

          # Compress the directory itself so the ZIP contains one top-level
          # HellLocker folder.
          Compress-Archive `
            -Path $packageDir `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Attest artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/package/HellLocker/HellLocker.exe
            dist/*.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "dist\$env:ZIP_NAME",
            "--verify-tag",
            "--generate-notes",
            "--title", "HellLocker $env:GITHUB_REF_NAME"
          )

          if ($env:GITHUB_REF_NAME -match "-") {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs
