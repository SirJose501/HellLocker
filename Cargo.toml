[package]
name = "hd2-preset-helper"
version = "1.9.7"
edition = "2024"
build = "build.rs"
description = "HellLocker: faction and mission loadout presets for Helldivers 2 (based on HD2 Preset Helper)"
license = "GPL-3.0-or-later"
repository = "https://github.com/xmg228/hd2-preset-helper"
readme = "README.md"

[package.metadata.winresource]
ProductName = "HellLocker"
FileDescription = "HellLocker loadout presets for Helldivers 2"
OriginalFilename = "HellLocker.exe"
InternalName = "HellLocker"
CompanyName = "Sir Jose"
LegalCopyright = "Sir Jose and HellLocker contributors, GPL-3.0-or-later"

[features]
diagnostics = []

[[bin]]
name = "HellLocker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
fast_image_resize = { version = "6.1.0", features = ["image"] }
half = "2.7.1"
image = { version = "0.25.9", default-features = false, features = ["png", "ico"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "~1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "system-tray", "compat-1-2", "unstable-winit-030"] }
sys-locale = "0.3.2"
toml = "1.1.3"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
slint-build = "~1.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Security_Cryptography",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
